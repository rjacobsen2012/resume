name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Matches the deploy target: Hetzner and the home server both run 8.4.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none

      # Composer MUST come before the frontend build: resources/js/app.js imports
      # '../../vendor/tightenco/ziggy', which only exists once composer has run.
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      # The frontend build MUST come before the tests: feature tests render Blade
      # views that call @vite, which fails with "Vite manifest not found" if
      # public/build/manifest.json is absent.
      - name: Build frontend
        run: npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # The suite runs on sqlite :memory: (phpunit.xml), so there is no database
      # service, no CI secret and no seeding step to go stale.
      - name: Run tests
        run: php artisan test

  static-analysis:
    name: Static Analysis + Style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Level 5 with an EMPTY baseline. If this starts failing, something real changed.
      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

      # Reported, not blocking: both repos still carry pre-existing style
      # violations in files this modernization never opened.
      - name: Pint (style check only, changes nothing)
        run: ./vendor/bin/pint --test
        continue-on-error: true

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Composer audit
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm audit
        run: |
          npm ci
          npm audit --omit=dev
